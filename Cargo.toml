[workspace]
members = ["engine", "application"]
# default-members = ["app"]

[[bin]]
name = "application"
path = "app/src/main.rs"

[package]
name = "alchemy_editor"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
unicode-segmentation = "1"
tree-sitter = "0.20.10"
tree-sitter-rust = "0.20.3"
futures = "0.3.28"
jsonrpc-lite = "0.6.0"
lsp-types = "0.94.1"
serde = "1.0.189"
serde_json = "1.0.107"
smol = "1.3.0"
fuzzy-matcher = "*"
pretty_assertions = "1.4.0"
criterion = { version = "0.4", features = ["html_reports"] }
rfd = "0.12.1"
rustc-hash = "1.1.0"
thiserror = "1.0.58"
anyhow = "1.0.82"